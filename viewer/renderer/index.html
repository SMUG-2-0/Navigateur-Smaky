<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;" />
  <title>Navigateur Smaky</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="topbar">
    <button id="openBtn">📂 Ouvrir un dossier extrait…</button>
    <button id="reportBtn" disabled>📊 Rapport…</button>
    <button id="helpBtn">❔ Aide</button>
    <span id="appVersion" class="muted"></span>
    <span id="folderPath" class="muted">aucun dossier ouvert</span>

    <div class="topzones">
      <div class="zone">
        <label>Types (extensions)</label>
        <button id="extBtn" disabled>Tous les types ▾</button>
      </div>
      <div class="zone">
        <label>Recherche dans les textes</label>
        <div class="search-row">
          <input id="textSearch" type="search" placeholder="mot ou expression… (Entrée)" disabled />
          <button id="optCase" class="opt" title="Respecter la casse" disabled>Aa</button>
          <button id="optRegex" class="opt" title="Expression régulière (.*)" disabled>.*</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Panneau de sélection des extensions -->
  <div id="extPanel" class="ext-panel hidden">
    <div class="ext-head">
      <div class="ext-mode">
        <label><input type="radio" name="extmode" value="include" checked> N'afficher que</label>
        <label><input type="radio" name="extmode" value="exclude"> Masquer</label>
      </div>
      <button id="extClose" class="icon-btn" title="Fermer">✕</button>
    </div>
    <input id="extSearch" type="text" placeholder="filtrer la liste…" />
    <div class="ext-actions">
      <button id="extAll">Tout cocher</button>
      <button id="extNone">Tout décocher</button>
      <label class="ext-alpha"><input type="checkbox" id="extAlpha"> Alphabétique</label>
      <span id="extSelCount" class="muted"></span>
    </div>
    <div id="extList" class="ext-list"></div>
  </div>

  <main id="layout">
    <section id="treePane" aria-label="Arborescence">
      <div id="treeTabs" class="tree-tabs hidden">
        <button id="tabTree" class="active">Arborescence</button>
        <button id="tabResults">Résultats</button>
      </div>
      <div id="tree" class="tree"></div>
      <div id="results" class="results hidden"></div>
    </section>

    <section id="viewPane" aria-label="Visualisation">
      <div id="meta" class="meta hidden"></div>
      <div id="viewerToolbar" class="viewer-toolbar hidden">
        <span id="viewerNote" class="muted"></span>
      </div>
      <div id="content" class="content">
        <p class="placeholder">Ouvre un dossier extrait, puis sélectionne un fichier.</p>
      </div>
    </section>
  </main>

  <!-- Dialogue Rapport -->
  <div id="reportModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <strong>Rapport du disque</strong>
        <button id="reportClose" class="icon-btn" title="Fermer">✕</button>
      </div>
      <div class="modal-opts">
        <label>Périmètre
          <select id="reportScope"></select>
        </label>
        <label>Tri des extensions
          <select id="reportSort">
            <option value="count">par nombre</option>
            <option value="size">par taille</option>
            <option value="alpha">alphabétique</option>
          </select>
        </label>
        <label>Format
          <select id="reportFormat">
            <option value="text">Texte</option>
            <option value="csv">CSV</option>
            <option value="html">HTML</option>
          </select>
        </label>
        <span class="spacer"></span>
        <button id="reportCopy">Copier</button>
        <button id="reportSave">Enregistrer…</button>
      </div>
      <pre id="reportPreview" class="report-preview"></pre>
      <div id="reportStatus" class="muted"></div>
    </div>
  </div>

  <!-- Fenêtre d'aide -->
  <div id="helpModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <strong>Aide — Navigateur Smaky</strong>
        <button id="helpClose" class="icon-btn" title="Fermer">✕</button>
      </div>
      <div id="helpBody" class="help-body"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
