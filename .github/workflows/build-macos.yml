# Construit l'application macOS (.dmg) sur un runner macOS gratuit de GitHub.
#
# Pourquoi : produire une version Mac ne peut pas se faire sous Windows/Linux avec
# electron-builder ; ce workflow le fait « dans le nuage », sans posséder de Mac.
#
# Déclenchement :
#   - manuel  : onglet « Actions » -> « Build macOS » -> « Run workflow » ;
#   - sur tag : pousser un tag « vX.Y.Z » crée en plus une Release avec le .dmg.
#
# Note signature : le .dmg n'est PAS signé (pas de compte Apple Developer). Au
# premier lancement, macOS affichera un avertissement ; voir le README pour la
# marche à suivre (clic droit -> Ouvrir, ou « xattr -dr com.apple.quarantine »).

name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write # nécessaire pour créer une Release sur un tag

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        working-directory: viewer
        run: npm ci

      - name: Construire le .dmg (universel Intel + Apple Silicon, non signé)
        working-directory: viewer
        env:
          # Pas de certificat : on désactive la découverte de signature pour
          # éviter que la construction n'échoue à chercher une identité Apple.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx --no-install electron-builder --mac dmg --universal

      - name: Publier le .dmg comme artefact du run
        uses: actions/upload-artifact@v4
        with:
          name: Navigateur-Smaky-macOS
          path: viewer/dist/*.dmg
          if-no-files-found: error

      - name: Créer une Release (uniquement sur un tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" viewer/dist/*.dmg \
            --title "Navigateur Smaky ${GITHUB_REF_NAME}" \
            --notes "Build macOS automatique (non signé). Voir le README pour l'ouverture."
